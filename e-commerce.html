<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
        }
        h1 {
            margin-bottom: 24px;
            text-align: center;
        }
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 32px;
        }
        .product {
            background: #fafafa;
            border: 1px solid #ececec;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            transition: box-shadow 0.2s;
        }
        .product:hover {
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
        }
        .product img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 9px;
        }
        .product-title {
            font-size: 18px;
            margin: 12px 0 7px 0;
        }
        .product-price {
            color: #2661ec;
            font-weight: bold;
            margin-bottom: 14px;
        }
        button {
            padding: 8px 20px;
            background: #2661ec;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #163e90;
        }
        .cart {
            margin-top: 40px;
        }
        .cart h2 {
            margin-bottom: 10px;
        }
        .cart-list {
            padding-left: 0;
            list-style-type: none;
        }
        .cart-list li {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
            padding: 6px 0;
            border-bottom: 1px dotted #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple E-Commerce Shop</h1>
        <div class="product-list" id="product-list">
            <!-- Products will be injected here -->
        </div>

        <div class="cart" id="cart">
            <h2>Shopping Cart</h2>
            <ul class="cart-list" id="cart-list"></ul>
            <div id="cart-total"></div>
        </div>
    </div>
    <script>
        const products = [
            {
                id: 1,
                title: 'Wireless Headphones',
                price: 59.99,
                image: 'https://via.placeholder.com/120x120?text=Headphones'
            },
            {
                id: 2,
                title: 'Bluetooth Speaker',
                price: 39.99,
                image: 'https://via.placeholder.com/120x120?text=Speaker'
            },
            {
                id: 3,
                title: 'Fitness Watch',
                price: 99.99,
                image: 'https://via.placeholder.com/120x120?text=Watch'
            },
            {
                id: 4,
                title: 'USB Charger',
                price: 9.99,
                image: 'https://via.placeholder.com/120x120?text=Charger'
            }
        ];

        const cart = {};

        function renderProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            products.forEach(product => {
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
                    <img src="${product.image}" alt="${product.title}">
                    <div class="product-title">${product.title}</div>
                    <div class="product-price">$${product.price.toFixed(2)}</div>
                    <button onclick="addToCart(${product.id})">Add to Cart</button>
                `;
                productList.appendChild(div);
            });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!cart[productId]) {
                cart[productId] = { ...product, quantity: 1 };
            } else {
                cart[productId].quantity += 1;
            }
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cart-list');
            cartList.innerHTML = '';
            let total = 0;
            for (const key in cart) {
                const item = cart[key];
                total += item.price * item.quantity;
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${item.title} (x${item.quantity})</span>
                    <span>$${(item.price * item.quantity).toFixed(2)}</span>
                `;
                cartList.appendChild(li);
            }
            document.getElementById('cart-total').textContent =
                'Total: $' + total.toFixed(2);
        }

        renderProducts();
        renderCart();
    </script>
</body>
</html>
