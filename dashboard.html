<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .dashboard-container {
            max-width: 700px;
            margin: 50px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 40px 32px;
        }
        h1 {
            text-align: center;
            margin-bottom: 36px;
            color: #333;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            gap: 24px;
        }
        .card {
            flex: 1;
            background: #fafafa;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            padding: 24px 12px;
            text-align: center;
        }
        .stat-label {
            color: #888;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .stat-value {
            color: #0078d4;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        @media (max-width: 600px) {
            .stats { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Student Management Dashboard</h1>
        <div class="stats">
            <div class="card">
                <div class="stat-label">Total Students</div>
                <div class="stat-value">--</div>
            </div>
            <div class="card">
                <div class="stat-label">Active Courses</div>
                <div class="stat-value">--</div>
            </div>
            <div class="card">
                <div class="stat-label">Teachers</div>
                <div class="stat-value">--</div>
            </div>
        </div>
    </div>
</body>
</html>
