<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logout</title>
    <style>
        body {
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .logout-container {
            background: #fff;
            padding: 2em 3em;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            text-align: center;
        }
        .logout-container h1 {
            color: #374151;
            margin-bottom: 0.5em;
        }
        .logout-container p {
            color: #6b7280;
            margin-bottom: 2em;
        }
        .logout-container a {
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            padding: 0.75em 2em;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .logout-container a:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h1>Logged Out</h1>
        <p>You have been successfully logged out.</p>
        <a href="Login.html">Return to Login</a>
    </div>
</body>
</html>
